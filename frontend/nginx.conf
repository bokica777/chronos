server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # AppRouter (src/app/router/AppRouter.tsx) je "custom" client-side router
    # koji cita window.location.pathname sam - nema pravu biblioteku za
    # rutiranje. To znaci da server MORA da vrati index.html za bilo koju
    # putanju koja nije stvaran fajl (npr. /providers/abc-123), inace bi
    # refresh na dubljoj ruti vratio 404 od nginx-a umesto da React preuzme.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Staticki asset-i (JS/CSS/slike sa hash-om u imenu) mogu agresivno da se
    # keširaju - Vite pri svakom build-u generise novo ime fajla kad se
    # sadrzaj promeni.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
