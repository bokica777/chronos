spring.application.name=notification-service
server.port=8082

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=NotificationDb;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=Chronos!2026

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

spring.flyway.enabled=true

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=chronos
spring.rabbitmq.password=Chronos!2026

jwt.secret=Chronos-Dev-Jwt-Signing-Key-2026-DoNotUseInProduction
jwt.issuer=chronos-auth
jwt.audience=chronos-clients

provider-service.base-url=${PROVIDERSERVICE_BASEURL:http://localhost:5033}

auth-service.base-url=${AUTHSERVICE_BASEURL:http://localhost:5094}
auth-service.internal-api-key=${INTERNAL_API_KEY:Chronos-Dev-Internal-Key-2026}

# Mejlovi kupcu i partneru kad se napravi / plati rezervacija.
# Podrazumevano ISKLJUCENO (samo se loguje sta bi bilo poslato). Ukljuci sa
# NOTIFICATIONS_EMAIL_ENABLED=true i popuni SMTP_* promenljive - vidi
# docs/notification-email-setup.md (Gmail App Password - besplatno, pravi mejl).
# Stari naziv NOTIFICATIONS_PROVIDER_EMAIL_ENABLED i dalje radi.
notifications.email.enabled=${NOTIFICATIONS_EMAIL_ENABLED:${NOTIFICATIONS_PROVIDER_EMAIL_ENABLED:false}}
notifications.email.from=${SMTP_FROM:${SMTP_USERNAME:chronos@example.com}}
notifications.email.from-name=${SMTP_FROM_NAME:Chronos}
notifications.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Opcioni lokalni fajl sa SMTP podacima (NE ide na git - vidi .gitignore).
spring.config.import=optional:file:./secrets.properties

spring.mail.default-encoding=UTF-8
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

management.endpoint.health.probes.enabled=true

spring.output.ansi.enabled=ALWAYS
logging.level.rs.ftn.notification_service=DEBUG
