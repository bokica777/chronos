spring.application.name=booking-service

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=BookingDb;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=Chronos!2026

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

spring.flyway.enabled=true

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=chronos
spring.rabbitmq.password=Chronos!2026

# Isti HMAC kljuc/issuer/audience kao auth-service i provider-service
# (backend/services/auth-service/appsettings.json, backend/services/provider-service/appsettings.json)
# - tokeni se ovde proveravaju nezavisno, bez pozivanja auth-service-a.
jwt.secret=Chronos-Dev-Jwt-Signing-Key-2026-DoNotUseInProduction
jwt.issuer=chronos-auth
jwt.audience=chronos-clients

# v1/v2 - za Argo Rollouts canary demo. Isti Docker image se pokrece kao dva
# Deployment-a sa razlicitom vrednoscu ove promenljive (BOOKING_VERSION env var
# override) - v2 dodaje proveru kod provider-service-a pre potvrde rezervacije
# (vidi ProviderServiceClient), i obe verzije oznacavaju svoj odgovor
# "X-Booking-Service-Version" header-om (vidi VersionHeaderFilter) da bi se
# tokom postepenog rollout-a videlo koja verzija je odgovorila.
booking.version=v1
provider-service.base-url=http://localhost:5033