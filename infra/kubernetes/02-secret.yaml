# Plain Kubernetes Secret (base64, NE sealed-secrets/SOPS/Vault) - namerna
# odluka, isto obrazlozenje kao Docker faza: Stripe kljucevi su vec test-mode
# i vec javno vidljivi u istoriji repozitorijuma, pa enkriptovano upravljanje
# tajnama ovde ne brani nista stvarno, samo dodaje alat koji nije tema rada
# (vidi docs/k8s-argo-rollouts-plan.md sekcija 1.4 i docs/decisions/README.md).
#
# "stringData" (ne "data") namerno - kubectl sam base64-enkodira pri apply-u,
# citljivije je za pregled/odbranu nego rucno base64 kodirane vrednosti.
#
# NAPOMENA ZA PRAVU PRODUKCIJU (pomenuti na odbrani ako profesor pita): ovde bi
# islo External Secrets Operator ili Sealed Secrets, sa pravim rotiranim
# kljucevima van git istorije.
apiVersion: v1
kind: Secret
metadata:
  name: chronos-secrets
  namespace: chronos
type: Opaque
stringData:
  MSSQL_SA_PASSWORD: "Chronos!2026"
  RABBITMQ_DEFAULT_PASS: "Chronos!2026"

  AUTH_DB_CONNECTION: "Server=sqlserver,1433;Database=AuthDb;User Id=sa;Password=Chronos!2026;TrustServerCertificate=True;Encrypt=True"
  PROVIDER_DB_CONNECTION: "Server=sqlserver,1433;Database=ProviderDb;User Id=sa;Password=Chronos!2026;TrustServerCertificate=True;Encrypt=True"
  PAYMENT_DB_CONNECTION: "Server=sqlserver,1433;Database=PaymentDb;User Id=sa;Password=Chronos!2026;TrustServerCertificate=True;Encrypt=True"

  # Isti Stripe test-mode kljucevi kao appsettings.Development.json/compose.yaml -
  # bezbedno javno vidljivi (test kljucevi ne mogu pomeriti pravi novac).
  STRIPE_SECRET_KEY: "sk_test_51U8mh371oMy3oNwz3keczOrBq7lRQruJnLC25qqkOIzXBwPe4iJAANn1XwH4Jsyo31c5Z5q0g72lVyC7czjRWIK600j9ayJEr5"
  STRIPE_PUBLISHABLE_KEY: "pk_test_51U8mh371oMy3oNwzaluljMPwWy5RcXBoC7WuNhuvdgpcsHeWj3fPlCmSHkJn8V16Yz9JlY5N2sjNC7rFrIxUk3EN004DLsKuHh"

  # PRAZNO namerno - za razliku od Stripe test-kljuceva, ovo su stvarne mejl
  # kredencijale (Gmail App Password ili Mailtrap). Popuni pre "kubectl apply"
  # ako zelis da provider zaista dobija mejlove u klasteru - vidi
  # docs/notification-email-setup.md. Prazno = notification-service i dalje
  # radi normalno, samo ne salje prava obavestenja provajderu (vidi
  # NOTIFICATIONS_PROVIDER_EMAIL_ENABLED u 01-configmap.yaml).
  SMTP_USERNAME: ""
  SMTP_PASSWORD: ""
  SMTP_FROM: ""
