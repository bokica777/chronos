# Obican Deployment (1 replika) + emptyDir, NAMERNO ne StatefulSet - baza ovde
# postoji da bi aplikacija radila tokom demoa, ne da bi se demonstrirala
# otpornost baze na restart pod-a (nije tema rada). Ako pod restartuje tokom
# demoa, gubi se stanje - prihvatljivo, isto kao "docker compose down -v" pre
# svakog pokretanja. Vidi docs/k8s-argo-rollouts-plan.md sekciju 1.3.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sqlserver
  namespace: chronos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sqlserver
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: sqlserver
    spec:
      containers:
        - name: sqlserver
          image: mcr.microsoft.com/mssql/server:2022-latest
          ports:
            - containerPort: 1433
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chronos-secrets
                  key: MSSQL_SA_PASSWORD
          # SQL Server realno trazi ~2GB RAM da uopste startuje - request/limit
          # namerno vec dovoljno visoko da ne pukne CrashLoopBackOff na startu.
          resources:
            requests:
              cpu: "250m"
              memory: "1Gi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          readinessProbe:
            exec:
              command:
                - /opt/mssql-tools18/bin/sqlcmd
                - -S
                - localhost
                - -U
                - sa
                - -P
                - "$(MSSQL_SA_PASSWORD)"
                - -C
                - -Q
                - "SELECT 1"
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 10
          livenessProbe:
            tcpSocket:
              port: 1433
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /var/opt/mssql
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: sqlserver
  namespace: chronos
spec:
  selector:
    app: sqlserver
  ports:
    - port: 1433
      targetPort: 1433
